# Application
spring.application.name=bank-recommendation-system
server.port=5432

# Primary H2 Database (Read-only bank data)
spring.datasource.url=jdbc:h2:file:./data/transaction;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=postgres
spring.datasource.password=qwerty1234

# Secondary PostgreSQL Database (Dynamic rules)
spring.datasource.dynamic-rules.url=jdbc:postgresql://localhost:5432/bank_recommendations
spring.datasource.dynamic-rules.driver-class-name=org.postgresql.Driver
spring.datasource.dynamic-rules.username=postgres
spring.datasource.dynamic-rules.password=qwerty1234

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/migration/changelog.xml

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=3600s

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Telegram Bot
telegram.bot.token=YOUR_BOT_TOKEN_HERE
telegram.bot.username=YourBankRecommendationBot

# Logging
logging.level.ru.example.bank=DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG