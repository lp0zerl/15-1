spring.application.name=school
spring.profiles.active=dev

# Server configuration
server.port=5433

# Liquibase configuration
spring.liquibase.change-log=classpath:liquibase/changelog-master.yml
spring.liquibase.enabled=true

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Logging configuration
logging.level.ru.example=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.liquibase=INFO

server.error.include-message=always
# application-dev.properties
# Development profile
server.port=8080

# Logging for development
logging.level.ru.example=DEBUG
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Development-specific settings
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
debug=true
# application-prod.properties
# Production profile
server.port=5433

# Logging for production
logging.level.ru.example=INFO
logging.level.org.springframework.web=WARN
logging.file.name=logs/hogwarts-app.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Production-specific settings
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# application-test.properties
# Test profile
server.port=5433

# Logging for tests
logging.level.ru.example=WARN
logging.level.org.springframework.web=WARN

# Test database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=postrage
spring.datasource.password=qwerty1234
spring.liquibase.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
